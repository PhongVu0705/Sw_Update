<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Software Update Tool — deploy firmware and send manual commands to connected devices."
    />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23d01b2e'/%3E%3Cpath d='M8 3v6M5.5 7L8 9.5 10.5 7M4 12h8' stroke='%23fff' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Software Update Tool</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="main-windows">
      <header class="header">
        <div class="header-inner">
          <h1 class="text-wrapper">Software Update Tool</h1>
          <!-- <p class="div">Made By Grey Le Phong Vu</p> -->
        </div>
      </header>

      <main class="main-content" id="main-content">
        <section
          class="function-grid"
          aria-label="Software update tool actions"
        >
          <div class="row">
            <a
              class="div-2"
              href="update.html"
              aria-describedby="mass-update-description"
            >
              <span class="icon" aria-hidden="true">
                <i class="bi bi-box-arrow-up"></i>
              </span>
              <span class="text">
                <span class="text-wrapper-2">Mass Update</span>
                <span class="p" id="mass-update-description"
                  >Deploy the latest firmware to all connected devices in a
                  single operation.</span
                >
              </span>
            </a>

            <a
              class="div-2"
              href="manual.html"
              aria-describedby="manual-command-description"
            >
              <span class="icon" aria-hidden="true">
                <i class="bi bi-terminal"></i>
              </span>
              <span class="text">
                <span class="text-wrapper-2">Manual Command Send</span>
                <span class="p" id="manual-command-description"
                  >Execute raw commands or scripts directly to devices for
                  debugging and testing.</span
                >
              </span>
            </a>
          </div>

          <div class="row">
            <button
              class="div-2"
              type="button"
              data-action="about"
              aria-describedby="about-software-description"
            >
              <span class="icon" aria-hidden="true">
                <i class="bi bi-file-person-fill"></i>
              </span>
              <span class="text">
                <span class="text-wrapper-2">About this software</span>
                <span class="p" id="about-software-description"
                  >Simplifies firmware deployment and updates across target
                  devices.</span
                >
              </span>
            </button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Software Update Tool &middot; v1.0.0</p>
        <p class="div">Made By Grey Le Phong Vu</p>
      </footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <header class="modal-header">
          <h2 class="modal-title" id="modal-title"></h2>
          <button
            class="modal-close"
            type="button"
            aria-label="Close dialog"
            data-close-modal
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
